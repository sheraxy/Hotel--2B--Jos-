<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"> <!-- 💡 Define o padrão de caracteres (permite acentos) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-inner">

                    <div class="carousel-item active">
                        <img src="assets/images/banner5.png" alt="Banner 1" class="d-block w-100">
                    </div>

                    <div class="carousel-item">
                        <img src="assets/images/banner6.png" alt="Banner 2" class="d-block w-100">
                    </div>

                    <div class="carousel-item">
                        <img src="assets/images/banner13.png" alt="Banner 3" class="d-block w-100">
                    </div>

            </div>

        </div>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient">
        <div class="container-fluid">
            <!-- 🏨 Logotipo / Nome do Hotel -->
            <a class="navbar-brand fw-bold text-white" href="/">🏨 Hotel Caribe Azul</a>
            <!-- 📱 Botão que aparece em telas pequenas (menu colapsável) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- 🧭 Itens de navegação -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active text-white" href="/">🏠 Cadastro</a>
                    </li>
                    <li class="nav-item">
                        <!-- Link para a página de consulta -->
                        <a class="nav-link text-white" href="/consulta">🔍 Consultar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container mt-4">
        <h2 class="text-center mb-4"> Cadastro de Clientes</h2>

    <form id="formCadastro" class="p-3 rounded bg-light shadow">
        <div>
            <div>
                <label> Nome:</label>
                <input type="text" name="nome" required>
            </div>
        </div>
        <div>
            <div>
                <label> CPF:</label>
                <input type="text" name="cpf" required>
            </div>
        </div>

        <div>
            <div>
                <label> Email:</label>
                <input type="email" name="email" required>
            </div>
        </div>
        <div>
            <div>
                <label> Telefone:</label>
                <input type="text" name="telefone" required>
            </div>
        </div>

        <div>
            <div>
                <label> Endereço:</label>
                <input type="text" name="endereco" required>
            </div>
        </div>

        <div>
            <div>
                <label> Observações:</label>
                <textarea type="text" name="observacoes" required> </textarea>
            </div>
        </div>
        <button type="submit" class="btn-primary" >Cadastrar</button>
    </form>
    
    </main>
    <div id="mensagem"></div>

    <!-- =============================================================================
    ⚙️ SCRIPTS JAVASCRIPT
    -----------------------------------------------------------------------------
        💡 O segundo importa o main.js (responsável pela comunicação com Flask e o efeito de neve).
    ============================================================================= -->

    <script src="assets/js/main.js"></script>

    <footer class="text-center mt-5 p-3 text-white bg-dark">
        <p> Sistema de cadastro | Desenvolvido para fins didáticos</p>
    </footer>


</body>
</html>
